
name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: YashwanthP-30
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2300D9FF&color_dots=%230D1117,%230B3D91,%230078B8,%2300A6D6,%2300D9FF
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2300D9FF&color_dots=%230D1117,%230B3D91,%230078B8,%2300A6D6,%2300D9FF

      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
